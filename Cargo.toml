[workspace]
resolver = "2"
members = [
    "crates/ecf",
    "crates/era",
    "crates/xmb",
    "crates/era-cli",
    "crates/xmb-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/coconutbird/ensemble-rs"
authors = ["coconutbird"]

[workspace.dependencies]
# Internal crates
ecf = { path = "crates/ecf" }
era = { path = "crates/era" }
xmb = { path = "crates/xmb" }

# External dependencies
byteorder = "1.5"
flate2 = "1.0"
thiserror = "2.0"
sha1 = "0.10"
clap = { version = "4.5", features = ["derive"] }
quick-xml = "0.37"

