[workspace]
resolver = "2"
members = [
    "crates/bdt",
    "crates/ddx",
    "crates/ecf",
    "crates/era",
    "crates/uax",
    "crates/xmb",
    "crates/ugx",
    "crates/era-cli",
    "crates/xmb-cli",
    "crates/ugx-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/coconutbird/ensemble-rs"
authors = ["coconutbird"]

[workspace.dependencies]
# Internal crates
bdt = { path = "crates/bdt" }
ddx = { path = "crates/ddx" }
ecf = { path = "crates/ecf" }
era = { path = "crates/era" }
uax = { path = "crates/uax" }
xmb = { path = "crates/xmb" }
ugx = { path = "crates/ugx" }
ugx-cli = { path = "crates/ugx-cli" }

# External dependencies
byteorder = "1.5"
flate2 = "1.0"
thiserror = "2.0"
sha1 = "0.10"
clap = { version = "4.5", features = ["derive"] }
quick-xml = "0.37"
half = "2.4"

