[package]
name = "ensemble-rs"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "2"
members = [
    "crates/bdt",
    "crates/ddx",
    "crates/ecf",
    "crates/era",
    "crates/uax",
    "crates/xmb",
    "crates/ugx",
    "crates/xtd",
    "crates/xtt",
    "crates/era-cli",
    "crates/xmb-cli",
    "crates/ugx-cli",
]

[dependencies]
xtt = { path = "crates/xtt" }
ecf = { path = "crates/ecf" }
era = { path = "crates/era" }
ugx = { path = "crates/ugx" }
byteorder = "1.5"
image = "0.25"

[[example]]
name = "test_xtt"
path = "examples/test_xtt.rs"

[[example]]
name = "list_era_shaders"
path = "examples/list_era_shaders.rs"

[[example]]
name = "dump_ugx"
path = "examples/dump_ugx.rs"

[[example]]
name = "check_roads"
path = "examples/check_roads.rs"

[[example]]
name = "extract_check_decals"
path = "examples/extract_check_decals.rs"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/coconutbird/ensemble-rs"
authors = ["coconutbird"]

[workspace.dependencies]
# Internal crates
bdt = { path = "crates/bdt" }
ddx = { path = "crates/ddx" }
ecf = { path = "crates/ecf" }
era = { path = "crates/era" }
uax = { path = "crates/uax" }
xmb = { path = "crates/xmb" }
ugx = { path = "crates/ugx" }
xtd = { path = "crates/xtd" }
xtt = { path = "crates/xtt" }
ugx-cli = { path = "crates/ugx-cli" }

# External dependencies
byteorder = "1.5"
texture2ddecoder = "0.1"
flate2 = "1.0"
thiserror = "2.0"
sha1 = "0.10"
tiger = "0.2"
clap = { version = "4.5", features = ["derive"] }
quick-xml = "0.37"
half = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
memmap2 = "0.9"
zerocopy = { version = "0.8", features = ["derive"] }
