[workspace]
resolver = "3"
members = [
    "crates/bdt",
    "crates/ddx",
    "crates/ecf",
    "crates/era",
    "crates/uax",
    "crates/xml",
    "crates/xmb",
    "crates/ugx",
    "crates/xtd",
    "crates/xtt",
    "crates/era-cli",
    "crates/xmb-cli",
    "crates/ugx-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/coconutbird/ensemble-formats"
authors = ["coconutbird"]

[workspace.dependencies]
# Internal crates
bdt = { path = "crates/bdt" }
ddx = { path = "crates/ddx" }
ecf = { path = "crates/ecf" }
era = { path = "crates/era" }
uax = { path = "crates/uax" }
xmb = { path = "crates/xmb" }
ugx = { path = "crates/ugx" }
xtd = { path = "crates/xtd" }
xml = { path = "crates/xml" }
xtt = { path = "crates/xtt" }
ugx-cli = { path = "crates/ugx-cli" }

# External dependencies
byteorder = "1.5"
texture2ddecoder = "0.1"
flate2 = "1.0"
thiserror = "2.0"
sha1 = "0.10"
tiger = "0.2"
clap = { version = "4.5", features = ["derive"] }
quick-xml = "0.37"
xmlparser = { version = "0.13", default-features = false }
half = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
memmap2 = "0.9"
image = "0.25"
zerocopy = { version = "0.8", features = ["derive"] }
